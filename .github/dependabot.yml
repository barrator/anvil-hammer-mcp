version: 2
updates:
  # npm dependencies (pinned in the lockfile).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5

  # Base images in the Dockerfile (pinned by digest).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Gateway image in the example compose file (pinned by digest).
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly

  # GitHub Actions (pinned by commit SHA).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
