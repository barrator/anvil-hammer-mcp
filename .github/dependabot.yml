version: 2
updates:
  # npm dependencies (pinned in the lockfile).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (peer typescript <6.1.0).
      # Remove this entry once it accepts TypeScript 7.
      - dependency-name: typescript
        versions: [">=7.0.0"]
    open-pull-requests-limit: 5

  # Base images in the Dockerfile (pinned by digest).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Gateway image in the example compose file (pinned by digest).
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly

  # GitHub Actions (pinned by commit SHA).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
