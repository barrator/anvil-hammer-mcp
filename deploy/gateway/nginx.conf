# Gateway for anvil-hammer-mcp: the only container with internet access.
#
#  Ingress  reverse proxy on the host (Caddy) -> 127.0.0.1:<port> -> here (edge network)
#           -> server (internal network). HTTP, so X-Forwarded-For can be controlled.
#  Egress   the server resolves www.worldanvil.com and claude.ai to this container
#           (extra_hosts). TLS passes through untouched; the target is chosen by
#           the SNI name, and only these two names on port 443 get through.
#           The gateway never sees keys or content: TLS stays end to end.
#
# Addresses are fixed in docker-compose.yml (networks "internal" and "edge").
# If you change the subnets there, change them here too.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 5m;

    # X-Forwarded-For is believed only from the host side of the edge network,
    # that is, connections that came through the port published on 127.0.0.1
    # (the reverse proxy). From anyone else the header is replaced by the peer
    # address. The server, in turn, trusts the header only from this gateway.
    set_real_ip_from 10.213.71.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    server {
        listen 10.213.71.2:8080;

        location / {
            proxy_pass http://10.213.70.3:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            # One address only: the client (trusted case) or the peer.
            proxy_set_header X-Forwarded-For $remote_addr;
            # Streamable HTTP uses long-lived event streams.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}

stream {
    # Allowed TLS names. Everything else goes to a closed port and is cut.
    map $ssl_preread_server_name $egress_target {
        www.worldanvil.com  www.worldanvil.com:443;
        claude.ai           claude.ai:443;
        default             127.0.0.1:1;
    }

    # Docker's embedded DNS (the gateway is on a user-defined network).
    resolver 127.0.0.11 ipv6=off valid=60s;
    resolver_timeout 5s;

    server {
        listen 10.213.70.2:443;
        ssl_preread on;
        proxy_pass $egress_target;
        proxy_connect_timeout 10s;
        proxy_timeout 10m;
    }
}
